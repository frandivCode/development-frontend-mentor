<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  <title>Frontend Mentor | Blog preview card</title>

</head>

<body>
  <div class="card-blog">
    <img class="card-img" src="./assets/images/illustration-article.svg" alt="image of the blog">
    <div class="content-texts">
      <p class="tag text-preset-3-bold">Learning</p>

      <p class="date text-preset-3">Published 21 Dec 2023</p>

      <h2 class="lang text-preset-1">HTML & CSS foundations</h2>

      <p class="text-preset-2">These languages are the backbone of every website, defining structure, content, and
        presentation.</p>
    </div>

    <div class="author">
      <img class="avatar-author" src="./assets/images/image-avatar.webp" alt="image of the author">
      <span class="text-preset-3-bold">Greg Hooper</span>
    </div>
  </div>

</body>

</html>
