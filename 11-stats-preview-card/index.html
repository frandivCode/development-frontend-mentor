<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&display=swap"
    rel="stylesheet">
  <title>Frontend Mentor | Stats preview card component</title>
</head>

<body>
  <main>
    <article class="card-stats">

      <div class="card-content">
        <div class="hero-stats">
          <h1 class="title-stats">Get <span>insights</span> that help your business grow.</h1>
          <p class="description-stats">Discover the benefits of data analytics and make better decisions regarding
            revenue, customer experience, and overall efficiency.</p>
        </div>

        <div class="stats">
          <div class="stat-item">
            <p class="stat-number">10k+</p>
            <p class="stat-label">companies</p>
          </div>
          <div class="stat-item">
            <p class="stat-number">314</p>
            <p class="stat-label">templates</p>
          </div>
          <div class="stat-item">
            <p class="stat-number">12M+</p>
            <p class="stat-label">queries</p>
          </div>
        </div>
      </div>

      <picture class="card-image">
        <source media="(max-width: 767px)" srcset="./images/image-header-mobile.jpg">
        <img src="./images/image-header-desktop.jpg" alt="People in a agency">
      </picture>

    </article>
  </main>
</body>

</html>
