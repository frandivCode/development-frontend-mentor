<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | NFT preview card component</title>


</head>

<body>
  <main class="card-container">
    <article class="card-nft">

      <a href="#" class="image-wrapper">
        <img class="img-nft" src="./images/image-equilibrium.jpg" alt="Equilibrium NFT">
      </a>

      <div class="info-nft">
        <h2 class="name-nft">Equilibrium #3429</h2>
        <p class="description-nft">Our Equilibrium collection promotes balance and calm.</p>
      </div>

      <div class="buy-nft">
        <p class="price-nft">
          <img src="./images/icon-ethereum.svg" alt="ETH"> 0.041 ETH
        </p>
        <p class="expiration-nft">
          <img src="./images/icon-clock.svg" alt="Clock"> 3 days left
        </p>
      </div>

      <div class="line"></div>
      <div class="author-nft">
        <img class="img-avatar" src="./images/image-avatar.png" alt="Avatar of Jules Wyvern">
        <p class="by-nft">Creation of <span class="highlight">Jules Wyvern</span></p>
      </div>

    </article>
  </main>
</body>

</html>
