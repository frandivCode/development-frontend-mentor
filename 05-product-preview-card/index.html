<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Product preview card component</title>
</head>

<body>
  <main class="page">
    <div class="card__wrapper">
      <article class="card__product">
        <picture class="card__media">
          <source media="(max-width: 640px)" srcset="./images/image-product-mobile.jpg">
          <img class="card__img" src="./images/image-product-desktop.jpg"
            alt="Gabrielle Essence Eau De Parfum bottle on a table with green leaves" loading="lazy">
        </picture>

        <div class="card__content">
          <p class="card__tag">Perfume</p>

          <h1 class="card__title">Gabrielle Essence Eau De Parfum</h1>

          <p class="card__description">A floral, solar and voluptuous interpretation composed by Olivier Polge,
            Perfumer-Creator for the House of CHANEL.
          </p>

          <div class="card__prices">
            <p class="card__price-new">$149.99</p>
            <s>$169.99</s>
          </div>
          <button class="card__btn" type="button">
            <span class="card__btn-icon">
              <img src="./images/icon-cart.svg" alt="Icon cart">
            </span>
            <p>Add to Cart</p>
          </button>
        </div>

      </article>
    </div>
  </main>

</body>

</html>
