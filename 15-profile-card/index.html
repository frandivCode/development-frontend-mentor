<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Profile card component</title>
</head>

<body>
  <main>
    <article class="card">
      <div class="card__header"></div>

      <div class="card__body">
        <img class="card__avatar" src="./images/image-victor.jpg" alt="Foto de perfil de Victor Crest">
        <div class="card__info">
          <h1 class="card__title">Victor Crest <span class="card__age">26</span></h1>
          <p class="card__location">London</p>
        </div>
      </div>

      <ul class="card__stats">
        <li class="card__stat">
          <h2 class="card__stat-number">80K</h2>
          <p class="card__stat-label">Followers</p>
        </li>
        <li class="card__stat">
          <h2 class="card__stat-number">803K</h2>
          <p class="card__stat-label">Likes</p>
        </li>
        <li class="card__stat">
          <h2 class="card__stat-number">1.4K</h2>
          <p class="card__stat-label">Photos</p>
        </li>
      </ul>

    </article>
  </main>
</body>

</html>
