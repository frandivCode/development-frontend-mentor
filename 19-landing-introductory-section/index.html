<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | Huddle landing page</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Poppins:wght@400;600&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="page">

  <div class="container">

    <header class="header">
      <a href="#" aria-label="Huddle Home">
        <img src="./images/logo.svg" alt="Huddle Logo" class="header__logo">
      </a>
    </header>

    <main class="hero">
      <div class="hero__image-wrapper">
        <img src="./images/illustration-mockups.svg" alt="App interface mockups showing a desktop and mobile view"
          class="hero__img">
      </div>

      <article class="hero__content">
        <h1 class="hero__title">Build The Community Your Fans Will Love</h1>
        <p class="hero__desc">
          Huddle re-imagines the way we build communities. You have a voice, but so does your audience.
          Create connections with your users as you engage in genuine discussion.
        </p>
        <a href="#" class="btn btn--primary">Register</a>
      </article>
    </main>

    <footer class="footer">
      <ul class="social" aria-label="Social media links">
        <li class="social__item">
          <a href="#" class="social__link" aria-label="Facebook">
            <i class="fab fa-facebook-f" aria-hidden="true"></i>
          </a>
        </li>
        <li class="social__item">
          <a href="#" class="social__link" aria-label="Twitter">
            <i class="fab fa-twitter" aria-hidden="true"></i>
          </a>
        </li>
        <li class="social__item">
          <a href="#" class="social__link" aria-label="Instagram">
            <i class="fab fa-instagram" aria-hidden="true"></i>
          </a>
        </li>
      </ul>
    </footer>

  </div>
</body>

</html>
