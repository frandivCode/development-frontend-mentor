<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <title>Frontend Mentor | Fylo data storage component</title>

</head>

<body>

  <main class="dashboard">

    <section class="card card--actions">
      <img src="./images/logo.svg" alt="Fylo logo" class="card__logo">

      <ul class="actions__list">
        <li class="actions__item">
          <button type="button" class="actions__btn" aria-label="Open Documents">
            <img src="./images/icon-document.svg" alt="" aria-hidden="true">
          </button>
        </li>
        <li class="actions__item">
          <button type="button" class="actions__btn" aria-label="Open Folders">
            <img src="./images/icon-folder.svg" alt="" aria-hidden="true">
          </button>
        </li>
        <li class="actions__item">
          <button type="button" class="actions__btn" aria-label="Uploads a file">
            <img src="./images/icon-upload.svg" alt="" aria-hidden="true">
          </button>
        </li>
      </ul>
    </section>

    <section class="card card--storage">
      <p class="storage__text">You've used <strong class="storage__bold" id="used-storage">815 GB</strong> of your
        storage</p>

      <div class="progress-wrapper">

        <input id="input-range" class="input-progress__bar" aria-label="Adjust storage usage" type="range" min="0"
          max="1000" value="815">

        <div class="progress" role="progressbar" aria-label="Storage progress" aria-valuenow="815" aria-valuemin="0"
          aria-valuemax="1000">
          <div class="progress__bar" id="progress-bar">
            <div class="progress__dot"></div>
          </div>
        </div>

      </div>

      <div class="progress__labels">
        <span class="progress__label">0 GB</span>
        <span class="progress__label">1000 GB</span>
      </div>

      <div class="tooltip">
        <strong class="tooltip__number" id="tooltip-number">185</strong>
        <span class="tooltip__text">GB Left</span>
      </div>
    </section>

  </main>
  <script src="app.js"></script>
</body>

</html>
