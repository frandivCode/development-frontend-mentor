<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
    rel="stylesheet">
  <title>Frontend Mentor | Order summary card</title>
</head>

<body>
  <main>
    <article class="card-summary">
      <img class="img-header" src="./images/illustration-hero.svg" alt="girl listen music">
      <div class="card-content">
        <div class="hero-summary">
          <h1 class="title-summary">Order Summary</h1>
          <p class="description-summary">You can now listen to millions of songs, audiobooks, and podcasts on any
            device anywhere you like!
          </p>
        </div>

        <div class="plan-summary">
          <div class="info-plan">
            <img class="img-music" src="./images/icon-music.svg" alt="icon of music">
            <div class="text-plan">
              <p class="title-plan">Annual Plan</p>
              <p class="price-plan">$59.99/year</p>
            </div>
          </div>
          <a href="#" class="btn-change-plan">Change</a>
        </div>

        <div class="footer-summary">
          <button class="btn-payment">Proceed to Payment</button>
          <button class="btn-cancel">Cancel Order</button>
        </div>
      </div>
    </article>
  </main>
</body>

</html>
